[package]
name = "anthrex"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "A terminal multiplexer for coding agents"
# Milestone 9.12, decision 13: one integration-test binary, `tests/it/main.rs`; no file
# is kept alone (decision 14).
autotests = false

[[bin]]
name = "anthrex"
path = "src/main.rs"

[[test]]
name = "it"
path = "tests/it/main.rs"

[dependencies]
proto.workspace = true
common.workspace = true
config.workspace = true
daemon.workspace = true
tui.workspace = true
mcp.workspace = true
anyhow.workspace = true
clap.workspace = true
tokio.workspace = true
crossterm.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
libc.workspace = true

[dev-dependencies]
# Stand-in executables a concurrent fork cannot leave busy (ETXTBSY).
testexec.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio.workspace = true
tokio-util.workspace = true
