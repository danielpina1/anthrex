name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  RUST_BACKTRACE: "1"

jobs:
  ci:
    name: ci (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --all --check
        run: cargo fmt --all --check

      - name: cargo clippy --workspace --all-targets -- -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo build --workspace --all-targets
        run: cargo build --workspace --all-targets

      - name: cargo test --workspace
        run: cargo test --workspace

      - name: python3 scripts/pty-smoke.py
        run: python3 scripts/pty-smoke.py
        env:
          # The smoke script compares rendered screens against literal text; a git
          # segment in the bottom bar would make those comparisons depend on the
          # state of whatever working tree the runner happens to have.
          ANTHREX_GIT: "off"

      - name: python3 scripts/pty_tree_smoke.py
        run: python3 scripts/pty_tree_smoke.py
        env:
          ANTHREX_GIT: "off"
