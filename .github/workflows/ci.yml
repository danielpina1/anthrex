name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  RUST_BACKTRACE: "1"

jobs:
  ci:
    name: ci (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # macOS runs the suite and the smoke in about 45 to 50 minutes since 9.6; 90 leaves
    # room without hiding a real hang for long.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: toolchain matches the pin
        run: |
          rustc --version
          rustc --version | grep -q '^rustc 1\.99\.'

      - uses: Swatinem/rust-cache@v2

      # Milestone 9.12 decision 8: the pinned nextest, the same as .config/nextest.toml's
      # `nextest-version`.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.146

      # Milestone 9.12 decision 22: the client's tree, dev-dependencies included, has no
      # daemon (decision 11), so an engine edit never rebuilds the TUI or its tests. The
      # tree is captured first, so a failing `cargo tree` fails the step, and no pipe
      # can be closed early, whatever the shell's `pipefail` setting.
      - name: the client does not depend on the daemon
        run: |
          tree=$(cargo tree -p anthrex-tui -e all)
          if printf '%s\n' "$tree" | grep -F anthrex-daemon; then
            echo "the client's dependency tree contains anthrex-daemon (decision 11)"
            exit 1
          fi

      - name: cargo fmt --all --check
        run: cargo fmt --all --check

      - name: cargo clippy --workspace --all-targets -- -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo build --workspace --all-targets
        run: cargo build --workspace --all-targets

      # .config/nextest.toml sets `fail-fast = false`, `retries = 0`, the slow-timeout and
      # the test groups. The step runs in the foreground: the suite's SIGINT tests need
      # SIGINT not to be ignored, as it would be under `nohup` or a background `&`.
      - name: cargo nextest run --workspace
        run: cargo nextest run --workspace

      # nextest cannot run doctests (decision 1); the workspace has none today, and this
      # keeps a future one from being skipped silently.
      - name: cargo test --workspace --doc
        run: cargo test --workspace --doc

      - name: python3 scripts/pty-smoke.py
        run: python3 scripts/pty-smoke.py
        env:
          # The smoke script compares rendered screens against literal text; a git
          # segment in the bottom bar would make those comparisons depend on the
          # state of whatever working tree the runner happens to have. This covers
          # scripts/pty_tree_smoke.py too: it has no __main__ of its own and is only
          # ever run as the stage module pty-smoke.py imports and drives.
          ANTHREX_GIT: "off"
