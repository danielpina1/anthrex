[workspace]
resolver = "3"
members = ["crates/proto", "crates/config", "crates/daemon", "crates/tui", "crates/cli", "crates/fake-agent"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"

[workspace.dependencies]
proto = { path = "crates/proto", package = "anthrex-proto" }
config = { path = "crates/config", package = "anthrex-config" }
daemon = { path = "crates/daemon", package = "anthrex-daemon" }
tui = { path = "crates/tui", package = "anthrex-tui" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
sha2 = "0.10"
rmp-serde = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
tokio-util = "0.7"
toml = "1"
bytes = "1"
dirs = "6"
libc = "0.2"
notify = "8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
portable-pty = "0.9"
vt100 = "0.16"
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
tui-term = "0.3"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
tempfile = "3"
unicode-width = "0.2"
unicode-segmentation = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
