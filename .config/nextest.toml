# Decision 5: tests that spawn a PTY, run real git, start a daemon (in-process `serve`,
# the `anthrex` binary, or a scripted socket peer standing in for one) or exec a
# stand-in. Every integration-test binary (`kind(test)`), plus the library-test modules
# that do the same (M9.12.3 Step 2), by module path:
#
# anthrex-daemon (unit tests):
#   decider::tests_context, decider::tests_route: a WindowManager over /bin/sh; tests_route writes stand-in `codex` scripts.
#   headless::codex_guard::tests: real git.
#   host::fake::tests, host::tests_git, host::tests_seal: real git through worktree::run_git.
#   host::tests_git_contains, host::tests_open_logs: stand-in scripts (write_executable).
#   lifecycle::tests: binds the daemon's socket.
#   manager::create::tests, manager::restart::tests, manager::restore::tests, manager::role_window::tests: a WindowManager spawning PTYs; role_window a stand-in.
#   models::tests: stand-in probe scripts.
#   profile::delivery::tests (tests_detect.rs), profile::tests_writes: real git, a stalling git stand-in.
#   profile::tests_installed, profile::tests_ready: a WindowManager, stand-ins, real git.
#   run::driver::adapt::evidence_tests, run::driver::adapt::goal::tests (and ::delivery, ::installed), run::driver::adapt::goal::queue::tests: a WindowManager and real git.
#   run::driver::adapt::history::tests: real git (found by behaviour: `Command::new(git)`, not matched by the grep).
#   run::driver::build::installed::tests, run::driver::build::tests (and ::tuning), run::driver::build_name::tests: stand-ins, a WindowManager.
#   run::driver::cleanup::tests: real git, a WindowManager.
#   run::driver::delivery::tests (and ::start): real git, stand-in scripts, a WindowManager.
#   run::driver::design_commit::queue_tests, ::round_tests, ::tests; run::driver::design_io::tests; run::driver::design_restore::tests (and ::service): real git, stand-ins, a WindowManager.
#   run::driver::effects::launch_journal_tests, run::driver::event_loop::lag_tests, run::driver::event_loop::tests: a WindowManager spawning stand-ins.
#   run::driver::finish_tests, run::driver::graph::tests, run::driver::host_ops::tests (and ::fields): a WindowManager, a stand-in, real git.
#   run::driver::merge::tier_tests, run::driver::ops::lane_ops::tests, run::driver::ops::racer_launch_tests, run::driver::ops::scheduled::tests, run::driver::ops::signals_tests (and ::pair): real git, a WindowManager, an in-process daemon socket.
