# cargo-nextest runs the workspace's tests (milestone 9.12, decision 1). Doctests stay on
# libtest: `cargo test --workspace --doc`, which nextest cannot run.

# Decision 8: the newest release at least two weeks old on the day of M9.12.1
# (0.9.146, 2026-09-21). CI's install step and AGENTS.md pin the same version.
nextest-version = { required = "0.9.146" }

[profile.default]
# Decision 2: SLOW each minute, terminated at ten (a hung test once cost nucleos 5.6
# hours). The slowest test measured in M9.12.1, run alone under nextest, was
# `run_e2e_merge::e2e_red_candidate_goes_back_to_the_worker`, 338.1 s (its sibling
# `e2e_second_conflict_blocks_the_task` 337.4 s), above decision 2's 300 s stop line
# ("Spec and brief defects" 10). M9.12.4 found why (each waited out a 300 s scripted
# gate that could never see the merge it waited for) and fixed the scripts: both take
# 6-7 s in the full suite now, and the slowest test is `run_e2e_crash`'s
# `e2e_crash_after_each_intent_kind_reconciles`, 50-52 s (M9.12.4), far inside 600 s.
slow-timeout = { period = "60s", terminate-after = 10 }
# Decision 3: a retry hides the flake docs/timing-budgets.md wants found at its root,
# and every failed test is diagnosed before a push, so the run never stops early.
retries = 0
fail-fast = false
# Decision 4: `test-threads` stays nextest's default, the number of CPUs.

[test-groups]
# Decision 6: a timing test runs alone, one at a time.
timing = { max-threads = 1 }
# Decision 5: the budgets in docs/timing-budgets.md were measured under libtest, which
# ran one binary at a time with 5 to 8 such tests per binary on average; nextest must
# not run more of them at once than that. Light tests fill the remaining threads.
real-io = { max-threads = 8 }

# Decision 6: the tests that assert an upper bound on elapsed wall-clock time as the
# property under test. Each starts only when no other test runs, and nothing starts
# beside it. First, so that no later override puts one in `real-io` (decision 7).
# Each entry is `test(/(^|::)<name>$/)`, so it names the same test before and after the
# binary merge (M9.12.6, M9.12.7). Found by behaviour (M9.12.3 Step 1; the milestone
# brief's "Implementation notes" has the sweep). Per entry: its file and line, its
# bound, and its docs/timing-budgets.md row (or, with no row, why the bound is the
# property), in the filter's order.
